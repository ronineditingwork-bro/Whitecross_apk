# Builds WHITECROSS.apk on every push: Actions → latest «APK» run → artifact WHITECROSS-apk.
name: APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - run: node --test test/*.test.js
      - run: gradle assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk WHITECROSS.apk
      - uses: actions/upload-artifact@v4
        with: { name: WHITECROSS-apk, path: WHITECROSS.apk }
