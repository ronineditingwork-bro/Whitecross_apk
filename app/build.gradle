plugins { id 'com.android.application' }

android {
    namespace 'ru.whitecross.price'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.whitecross.price'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    // Fixed debug key in the repo, so each new APK installs over the old one without losing saved data.
    signingConfigs {
        debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
